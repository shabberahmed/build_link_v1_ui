@if (isOpen()) {
  <div class="modal-backdrop" [class.stacked]="stacked()" (click)="onClose()" role="presentation">
    <div class="modal-content" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title">{{ title() }}</h3>
        <button class="modal-close" (click)="onClose()" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
