<label class="lang-switch" [class.inverted]="inverted()">
  <span class="sr-only">{{ 'lang.label' | t }}</span>
  <select [value]="i18n.locale()" (change)="onChange($event)" [attr.aria-label]="'lang.label' | t">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="te">తెలుగు</option>
  </select>
</label>
